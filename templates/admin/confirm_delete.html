{% extends "admin/base_admin.html" %}
{% block title %}Delete{% endblock %}
{% block content %}
<h1>Delete this {{ type_label }}?</h1>
<div class="card">
  <p>Are you sure you want to delete <strong>{{ object }}</strong>? This can't be undone.</p>
  <form method="post">
    {% csrf_token %}
    <div class="actions">
      <button type="submit" class="btn btn-danger">Yes, delete</button>
      <a href="{{ cancel_url }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
